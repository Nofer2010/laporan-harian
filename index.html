<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Laporan RM & CCM</title>
    <!-- Framework CSS Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Library Chart.js untuk Grafik -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-slate-50 min-h-screen p-4 md:p-8 font-sans">
    <div class="max-w-5xl mx-auto space-y-6">
        
        <!-- Header -->
        <div class="bg-white rounded-xl shadow-sm p-6 border border-slate-100">
            <h1 class="text-2xl font-bold text-slate-800">Dashboard Laporan Harian</h1>
            <p class="text-slate-500 text-sm">Pantau grafik dan akumulasi nilai RM & CCM</p>
        </div>

        <!-- Section Grafik -->
        <div class="bg-white rounded-xl shadow-sm p-6 border border-slate-100">
            <h2 class="text-lg font-semibold text-slate-700 mb-4">Grafik Pergerakan RM & CCM</h2>
            <div class="relative h-72 w-full">
                <canvas id="laporanChart"></canvas>
            </div>
        </div>

        <!-- Section Input & Edit -->
        <div class="bg-white rounded-xl shadow-sm p-6 border border-slate-100">
            <h2 class="text-lg font-semibold text-slate-700 mb-4" id="formTitle">Input Data Baru</h2>
            <form id="laporanForm" class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <!-- Input hidden untuk menyimpan ID dokumen saat proses Edit -->
                <input type="hidden" id="editDocId" value="">
                
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Input Rp RM</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-500">Rp</span>
                        <input type="number" id="inputRM" required class="w-full border border-slate-300 rounded-lg py-2.5 pl-10 pr-3 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all" placeholder="0">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Input Rp CCM</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-500">Rp</span>
                        <input type="number" id="inputCCM" required class="w-full border border-slate-300 rounded-lg py-2.5 pl-10 pr-3 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all" placeholder="0">
                    </div>
                </div>
                <div class="flex items-end space-x-2">
                    <button type="submit" id="btnSubmit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 rounded-lg transition-colors">
                        Simpan Data
                    </button>
                    <button type="button" id="btnCancel" class="hidden w-1/3 bg-slate-200 hover:bg-slate-300 text-slate-700 font-medium py-2.5 rounded-lg transition-colors">
                        Batal
                    </button>
                </div>
            </form>
        </div>

        <!-- Section Tabel & Total -->
        <div class="bg-white rounded-xl shadow-sm p-6 border border-slate-100">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-50 text-slate-600 text-sm uppercase tracking-wider">
                            <th class="p-4 border-b font-medium">Tanggal</th>
                            <th class="p-4 border-b font-medium">RM (Rp)</th>
                            <th class="p-4 border-b font-medium">CCM (Rp)</th>
                            <th class="p-4 border-b font-medium text-center">Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody" class="text-slate-600 text-sm">
                        <!-- Data dari Firebase akan muncul di sini -->
                    </tbody>
                    <tfoot class="bg-slate-50 font-semibold text-slate-800 text-sm">
                        <tr>
                            <td class="p-4 border-t text-right">Total Akumulasi:</td>
                            <td class="p-4 border-t">Rp <span id="totalRM">0</span></td>
                            <td class="p-4 border-t">Rp <span id="totalCCM">0</span></td>
                            <td class="border-t"></td>
                        </tr>
                        <tr class="bg-blue-50 text-blue-900 text-base">
                            <td class="p-4 border-t text-right font-bold" colspan="2">Total Keseluruhan (RM + CCM):</td>
                            <td class="p-4 border-t font-bold" colspan="2">Rp <span id="grandTotal">0</span></td>
                        </tr>
                    </tfoot>
                </table>
            </div>
        </div>
    </div>

    <!-- Firebase & Logika Aplikasi -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, addDoc, updateDoc, doc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        // GANTI DENGAN CONFIG FIREBASE ANDA
        const firebaseConfig = {
            apiKey: "AIzaSyC8Dnj8SqRLN5uU6mzE3Ri9G3UXx3TSeVE",
            authDomain: "warkop-bang-fer.firebaseapp.com",
            projectId: "warkop-bang-fer",
            storageBucket: "warkop-bang-fer.firebasestorage.app",
            messagingSenderId: "27974400468",
            appId: "1:27974400468:web:f8126ec645a6a437367e41"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const laporanRef = collection(db, "laporan_bulanan");

        // Inisialisasi Chart.js
        const ctx = document.getElementById('laporanChart').getContext('2d');
        const laporanChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: [], // Label Tanggal
                datasets: [
                    {
                        label: 'Nilai RM',
                        data: [],
                        borderColor: '#3b82f6', // Biru
                        backgroundColor: 'rgba(59, 130, 246, 0.1)',
                        borderWidth: 2,
                        fill: true,
                        tension: 0.4
                    },
                    {
                        label: 'Nilai CCM',
                        data: [],
                        borderColor: '#10b981', // Hijau
                        backgroundColor: 'rgba(16, 185, 129, 0.1)',
                        borderWidth: 2,
                        fill: true,
                        tension: 0.4
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { position: 'top' } },
                scales: {
                    y: { beginAtZero: true }
                }
            }
        });

        // Format Tanggal Hari Ini
        function getTodayDate() {
            const today = new Date();
            const dd = String(today.getDate()).padStart(2, '0');
            const mm = String(today.getMonth() + 1).padStart(2, '0'); 
            const yyyy = today.getFullYear();
            return `${dd}-${mm}-${yyyy}`;
        }

        // Handle Form Submit (Tambah & Edit)
        const form = document.getElementById('laporanForm');
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const editId = document.getElementById('editDocId').value;
            const rmValue = parseFloat(document.getElementById('inputRM').value) || 0;
            const ccmValue = parseFloat(document.getElementById('inputCCM').value) || 0;
            
            try {
                if (editId) {
                    // Logika Update/Edit Data
                    const docRef = doc(db, "laporan_bulanan", editId);
                    await updateDoc(docRef, { rm: rmValue, ccm: ccmValue });
                    resetForm();
                } else {
                    // Logika Tambah Data Baru
                    await addDoc(laporanRef, {
                        tanggal: getTodayDate(),
                        timestamp: new Date(),
                        rm: rmValue,
                        ccm: ccmValue
                    });
                    form.reset();
                }
            } catch (error) {
                console.error("Error: ", error);
                alert("Terjadi kesalahan. Pastikan koneksi dan rules Firebase sudah benar.");
            }
        });

        // Tampilkan Data Secara Realtime
        const q = query(laporanRef, orderBy("timestamp", "asc"));
        onSnapshot(q, (snapshot) => {
            const tableBody = document.getElementById('tableBody');
            tableBody.innerHTML = '';
            
            let sumRM = 0;
            let sumCCM = 0;
            
            // Array untuk update Chart
            const chartLabels = [];
            const chartDataRM = [];
            const chartDataCCM = [];

            snapshot.forEach((docSnap) => {
                const data = docSnap.data();
                const docId = docSnap.id;
                
                sumRM += data.rm;
                sumCCM += data.ccm;

                // Push data ke array Chart
                chartLabels.push(data.tanggal);
                chartDataRM.push(data.rm);
                chartDataCCM.push(data.ccm);

                tableBody.innerHTML += `
                    <tr class="border-b hover:bg-slate-50 transition-colors">
                        <td class="p-4">${data.tanggal}</td>
                        <td class="p-4">${data.rm.toLocaleString('id-ID')}</td>
                        <td class="p-4">${data.ccm.toLocaleString('id-ID')}</td>
                        <td class="p-4 text-center">
                            <button onclick="editData('${docId}', ${data.rm}, ${data.ccm})" class="text-blue-500 hover:text-blue-700 font-medium bg-blue-50 px-3 py-1 rounded-md">Edit</button>
                        </td>
                    </tr>
                `;
            });

            // Update Total Angka
            document.getElementById('totalRM').innerText = sumRM.toLocaleString('id-ID');
            document.getElementById('totalCCM').innerText = sumCCM.toLocaleString('id-ID');
            document.getElementById('grandTotal').innerText = (sumRM + sumCCM).toLocaleString('id-ID');

            // Update Grafik
            laporanChart.data.labels = chartLabels;
            laporanChart.data.datasets[0].data = chartDataRM;
            laporanChart.data.datasets[1].data = chartDataCCM;
            laporanChart.update();
        });

        // Fungsi Global untuk Edit Data
        window.editData = (id, rm, ccm) => {
            document.getElementById('editDocId').value = id;
            document.getElementById('inputRM').value = rm;
            document.getElementById('inputCCM').value = ccm;
            
            // Ubah tampilan form
            document.getElementById('formTitle').innerText = "Edit Data";
            document.getElementById('btnSubmit').innerText = "Update Data";
            document.getElementById('btnSubmit').classList.replace('bg-blue-600', 'bg-emerald-600');
            document.getElementById('btnCancel').classList.remove('hidden');
        };

        // Fungsi Batal Edit
        document.getElementById('btnCancel').addEventListener('click', resetForm);

        function resetForm() {
            form.reset();
            document.getElementById('editDocId').value = "";
            document.getElementById('formTitle').innerText = "Input Data Baru";
            document.getElementById('btnSubmit').innerText = "Simpan Data";
            document.getElementById('btnSubmit').classList.replace('bg-emerald-600', 'bg-blue-600');
            document.getElementById('btnCancel').classList.add('hidden');
        }
    </script>
</body>
</html>
